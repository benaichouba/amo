name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK with Capacitor
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: |
          npm install
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Build Web Application
        run: npx vite build

      - name: Initialize Capacitor
        run: |
          npx cap init DidactiPlan com.didactiplan.app --web-dir dist

      - name: Add Capacitor Android
        run: |
          npx cap add android

      - name: Sync Capacitor Android
        run: |
          npx cap sync android

      - name: Verify Android Project
        run: |
          test -f android/gradlew
          echo "Android Gradle project created successfully."

      - name: Build Debug APK with Gradle
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DidactiPlan-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
